    <img class="brand" src="../gatherthread-lockup.svg" alt="GatherThread">
    <p class="top-note">People · Devices · Agents</p>
    <h1 class="headline cover-headline"><span>Work together.</span><span>Bring your Agents.</span></h1>
    <p class="cover-subline">Discuss together. Build together. Continue on another device.</p>
    <figure class="cover-proof" aria-label="Complete real desktop and phone interfaces for the same project">
      <div class="capture cover-desktop"><img src="../en/11-focused-workspace.jpg" alt="Complete real English GatherThread desktop interface with example project content"></div>
      <div class="capture cover-phone"><img src="../en/12-phone.jpg" alt="Complete real English phone interface for the same example project"></div>

  <script>
    const fitPoster = () => document.documentElement.style.setProperty('--poster-scale', Math.min(innerWidth / 1600, innerHeight / 1000));
    fitPoster(); addEventListener('resize', fitPoster);
    Promise.all(Array.from(document.images, img => img.complete ? Promise.resolve() : new Promise(resolve => { img.onload = resolve; img.onerror = resolve; }))).then(async () => {
      await document.fonts.ready;
      window.__assetErrors = Array.from(document.images).filter(img => !img.naturalWidth).map(img => img.getAttribute('src'));
      window.__ready = window.__assetErrors.length === 0;
    });
  </script>
