name: Contract and security checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-agent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:ts
      - run: docker build -f ops/hosted-agent/Dockerfile -t gt-hosted-smoke .
      - run: node scripts/test-hosted-container.mjs
        env:
          GATHERTHREAD_TEST_HOSTED_IMAGE: gt-hosted-smoke
          GATHERTHREAD_HOSTED_AGENT_MEMORY_MIB: 768
      - run: node scripts/test-hosted-repository-container.mjs
        env:
          GATHERTHREAD_TEST_HOSTED_IMAGE: gt-hosted-smoke
          GATHERTHREAD_HOSTED_GITHUB_MEMORY_MIB: 768
      - name: Guarded single-CPU trial and repository smoke
        run: |
          set -euo pipefail
          task_image="$(docker image inspect --format '{{.Id}}' gt-hosted-smoke)"
          GATHERTHREAD_TEST_HOSTED_IMAGE="$task_image" node scripts/test-hosted-cpuset.mjs
          GATHERTHREAD_TEST_HOSTED_IMAGE="$task_image" node scripts/test-hosted-cpuset.mjs --shared-host
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Verify native Launcher brand icons
        run: python -m unittest discover -s prototypes/codex-launcher -p test_icons.py -v
      - if: matrix.os == 'windows-latest'
        name: Test Windows Codex Launcher
        run: python -m unittest discover -s prototypes/codex-launcher -p test_launcher.py -v
      - if: matrix.os == 'windows-latest'
        name: Build and verify Windows Codex Launcher
        run: |
          python prototypes/codex-launcher/build_dist.py
          python prototypes/codex-launcher/verify_dist.py
      - if: matrix.os == 'macos-latest'
        name: Test and build macOS Codex Launcher
        run: |
          python3 -m unittest discover -s prototypes/codex-launcher/macos -p 'test_*.py' -v
          python3 prototypes/codex-launcher/macos/build_dist.py
          codesign --verify --deep --strict 'prototypes/codex-launcher/.build-macos/GatherThread Launcher.app'
      - if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        name: Preserve verified public Launcher packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-launcher-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            prototypes/codex-launcher/dist/GatherThreadLauncher-*.zip
            prototypes/codex-launcher/dist/GatherThreadLauncher-*.dmg
            prototypes/codex-launcher/dist/GatherThreadLauncher-*.sha256
            prototypes/codex-launcher/dist/GatherThreadLauncher-*.provenance.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
