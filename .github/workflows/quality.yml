name: Contract and security checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - if: matrix.os == 'windows-latest'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - if: matrix.os == 'windows-latest'
        name: Test Windows Codex Launcher
        run: python -m unittest discover -s prototypes/codex-launcher -p test_launcher.py -v
      - if: matrix.os == 'windows-latest'
        name: Build and verify Windows Codex Launcher
        run: |
          python prototypes/codex-launcher/build_dist.py
          python prototypes/codex-launcher/verify_dist.py
