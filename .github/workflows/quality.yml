name: Contract and security checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-agent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:ts
      - run: docker build -f ops/hosted-agent/Dockerfile -t gt-hosted-smoke .
      - run: node scripts/test-hosted-container.mjs
        env:
          GATHERTHREAD_TEST_HOSTED_IMAGE: gt-hosted-smoke
          GATHERTHREAD_HOSTED_AGENT_MEMORY_MIB: 512
      - run: node scripts/test-hosted-repository-container.mjs
        env:
          GATHERTHREAD_TEST_HOSTED_IMAGE: gt-hosted-smoke
          GATHERTHREAD_HOSTED_GITHUB_MEMORY_MIB: 768
      - name: Guarded single-CPU trial and repository smoke
        run: |
          set -euo pipefail
          task_image="$(docker image inspect --format '{{.Id}}' gt-hosted-smoke)"
          GATHERTHREAD_TEST_HOSTED_IMAGE="$task_image" node scripts/test-hosted-cpuset.mjs
          GATHERTHREAD_TEST_HOSTED_IMAGE="$task_image" node scripts/test-hosted-cpuset.mjs --shared-host
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - if: matrix.os == 'windows-latest'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - if: matrix.os == 'windows-latest'
        name: Test Windows Codex Launcher
        run: python -m unittest discover -s prototypes/codex-launcher -p test_launcher.py -v
      - if: matrix.os == 'windows-latest'
        name: Build and verify Windows Codex Launcher
        run: |
          python prototypes/codex-launcher/build_dist.py
          python prototypes/codex-launcher/verify_dist.py
      - if: matrix.os == 'macos-latest'
        name: Test and build macOS Codex Launcher
        run: |
          python3 prototypes/codex-launcher/macos/build_dist.py
          codesign --verify --deep --strict 'prototypes/codex-launcher/.build-macos/GatherThread Launcher.app'
