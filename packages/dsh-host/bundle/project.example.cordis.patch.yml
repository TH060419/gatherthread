# Explicit project-level connector for the pinned DSH headless profile.
# Each writable GatherThread Session receives an independent DSH Agent/Session.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- insert:
    - id: gatherthread-dsh-project-host
      name: '@gatherthread/dsh-host/plugin'
      inject: [agents, sessions, sessionPersistence, llm]
      config:
        enabled: true
        bindingMode: project
        apiUrl: !!js process.env.GATHERTHREAD_API_URL
        credentialReference:
          kind: environment
          variable: GATHERTHREAD_DSH_TOKEN
        projectId: !!js process.env.GATHERTHREAD_PROJECT_ID
        deviceId: !!js process.env.GATHERTHREAD_DEVICE_ID
        workspacePath: !!js process.env.GATHERTHREAD_DSH_WORKSPACE
        stateRoot: !!js process.env.GATHERTHREAD_DSH_STATE_ROOT
        provider: !!js process.env.GATHERTHREAD_DSH_PROVIDER
        model: !!js process.env.GATHERTHREAD_DSH_MODEL
        pollIntervalMs: 1000
        pollLimit: 200
        shareToolEvents: !!js "process.env.GATHERTHREAD_DSH_SHARE_TOOL_EVENTS === '1'"
        refreshIntervalMs: 5000
        maxConcurrentSessions: 4
        retryBaseMs: 1000
        retryMaxMs: 30000
